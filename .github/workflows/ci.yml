name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit and PostgreSQL integration tests
        run: mvn -B verify
      - name: Build container
        run: docker build -t datadock:ci .
      - name: Compile Azure infrastructure
        run: az bicep build --file infra/containerapp.bicep --outfile /tmp/datadock-arm.json
      - name: Start packaged application and verify sample
        env:
          DB_PASSWORD: ci-only-database-password
          APP_API_KEY: ci-only-api-key-at-least-32-characters
        run: |
          docker compose up -d --build
          python3 scripts/smoke-test.py
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
        env:
          DB_PASSWORD: ci-only-database-password
          APP_API_KEY: ci-only-api-key-at-least-32-characters
      - name: Remove CI containers
        if: always()
        run: docker compose down -v
        env:
          DB_PASSWORD: ci-only-database-password
          APP_API_KEY: ci-only-api-key-at-least-32-characters
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/
